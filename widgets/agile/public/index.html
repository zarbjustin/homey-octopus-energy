<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script type="text/javascript" src="/homey.js" data-origin="widget"></script>
  <style>
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--homey-text-color, #222);
      padding: 10px 12px;
      box-sizing: border-box;
    }
    .head { display: flex; align-items: baseline; justify-content: space-between; }
    .name { font-size: 12px; color: var(--homey-text-color-light, #888); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .now { text-align: right; }
    .now .val { font-size: 20px; font-weight: 700; line-height: 1; }
    .now .val small { font-size: 11px; font-weight: 500; color: var(--homey-text-color-light, #888); }
    .badge {
      display: inline-block; font-size: 10px; font-weight: 600; padding: 1px 7px;
      border-radius: 9px; color: #fff; background: #888; text-transform: capitalize; margin-top: 3px;
    }
    .badge.plunge { background: #6f42c1; }
    .badge.cheap { background: #2ecc71; }
    .badge.normal { background: #f39c12; }
    .badge.expensive { background: #e74c3c; }

    .tabs { display: flex; gap: 6px; margin: 8px 0 6px; }
    .tab {
      flex: 1; text-align: center; font-size: 12px; font-weight: 600; padding: 5px 0;
      border: 0; border-radius: 14px; cursor: pointer; font-family: inherit; user-select: none;
      background: var(--homey-background-color, rgba(127,127,127,0.12));
      color: var(--homey-text-color-light, #888);
    }
    .tab.active { background: #7b3ff2; color: #fff; }
    .tab.disabled { opacity: 0.45; cursor: default; }

    .chart-wrap { display: flex; align-items: stretch; gap: 6px; }
    .axis { display: flex; flex-direction: column; justify-content: space-between; font-size: 9px; color: var(--homey-text-color-light, #888); text-align: right; min-width: 30px; padding: 2px 0 14px; }
    .chart-col { flex: 1; }
    .chart {
      position: relative; display: flex; align-items: stretch; gap: 1px;
      height: 86px;
    }
    .zero-line {
      position: absolute; left: 0; right: 0; height: 1px;
      background: rgba(127,127,127,0.42); pointer-events: none;
    }
    .bar-slot { flex: 1 1 0; min-width: 0; position: relative; }
    .bar {
      position: absolute; left: 0; right: 0;
      background: #888;
      border-radius: 1px 1px 0 0; min-height: 1px;
    }
    .bar.legacy { background: linear-gradient(180deg, #e64bff, #b521e0); }
    .bar.legacy-negative { background: linear-gradient(180deg, #8e44ff, #6f42c1); border-radius: 0 0 1px 1px; }
    .bar.legacy-cheapest { background: linear-gradient(180deg, #4dffa6, #16c172); }
    .bar.band-negative, .swatch.band-negative, .price-band-badge.band-negative { background: #2563eb; }
    .bar.band-green, .swatch.band-green, .price-band-badge.band-green { background: #16a34a; }
    .bar.band-yellow, .swatch.band-yellow, .price-band-badge.band-yellow { background: #ca8a04; }
    .bar.band-orange, .swatch.band-orange, .price-band-badge.band-orange { background: #ea580c; }
    .bar.band-red, .swatch.band-red, .price-band-badge.band-red { background: #dc2626; }
    body.palette-colourblind .bar.band-negative, body.palette-colourblind .swatch.band-negative,
    body.palette-colourblind .price-band-badge.band-negative { background: #0072b2; }
    body.palette-colourblind .bar.band-green, body.palette-colourblind .swatch.band-green,
    body.palette-colourblind .price-band-badge.band-green { background: #009e73; }
    body.palette-colourblind .bar.band-yellow, body.palette-colourblind .swatch.band-yellow,
    body.palette-colourblind .price-band-badge.band-yellow { background: #e6a700; }
    body.palette-colourblind .bar.band-orange, body.palette-colourblind .swatch.band-orange,
    body.palette-colourblind .price-band-badge.band-orange { background: #d55e00; }
    body.palette-colourblind .bar.band-red, body.palette-colourblind .swatch.band-red,
    body.palette-colourblind .price-band-badge.band-red { background: #cc4f87; }
    body.palette-high-contrast .bar.band-negative, body.palette-high-contrast .swatch.band-negative,
    body.palette-high-contrast .price-band-badge.band-negative { background: #0047ab; }
    body.palette-high-contrast .bar.band-green, body.palette-high-contrast .swatch.band-green,
    body.palette-high-contrast .price-band-badge.band-green { background: #007a3d; }
    body.palette-high-contrast .bar.band-yellow, body.palette-high-contrast .swatch.band-yellow,
    body.palette-high-contrast .price-band-badge.band-yellow { background: #8a6d00; }
    body.palette-high-contrast .bar.band-orange, body.palette-high-contrast .swatch.band-orange,
    body.palette-high-contrast .price-band-badge.band-orange { background: #c2410c; }
    body.palette-high-contrast .bar.band-red, body.palette-high-contrast .swatch.band-red,
    body.palette-high-contrast .price-band-badge.band-red { background: #991b1b; }
    .bar.cheapest-marker { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.95); }
    .bar.current { outline: 2px solid var(--homey-text-color, #fff); outline-offset: -1px; }
    .ticks { display: flex; justify-content: space-between; font-size: 9px; color: var(--homey-text-color-light, #888); margin-top: 2px; }
    .band-legend { display: flex; flex-wrap: wrap; gap: 4px 8px; margin-top: 5px; font-size: 9px; color: var(--homey-text-color-light, #666); }
    .legend-item { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
    .swatch { display: inline-block; width: 8px; height: 8px; border-radius: 2px; border: 1px solid rgba(0,0,0,0.18); }
    .band-advisory { margin-top: 4px; color: #92400e; font-size: 10px; }
    .price-band-badge { display: inline-block; font-size: 10px; font-weight: 600; padding: 1px 7px;
      border-radius: 9px; color: #fff; text-transform: capitalize; margin-top: 3px; }

    .best { font-size: 11px; margin: 8px 0 6px; }
    .best .hl { color: #16c172; font-weight: 600; }

    .lhead { display: flex; justify-content: space-between; font-size: 10px; text-transform: uppercase;
      letter-spacing: 0.04em; color: var(--homey-text-color-light, #888); padding: 2px 2px 4px; }
    .lhead .hl { color: #16c172; font-weight: 700; text-transform: none; letter-spacing: 0; }
    .list { max-height: 116px; overflow-y: auto; border-top: 1px solid rgba(127,127,127,0.15); }
    .li { display: flex; align-items: center; gap: 8px; font-size: 12.5px;
      padding: 5px 4px 5px 6px; border-bottom: 1px solid rgba(127,127,127,0.08); }
    .li .rank { display: inline-flex; align-items: center; justify-content: center;
      width: 17px; height: 17px; border-radius: 50%; font-size: 10px; font-weight: 700;
      background: #16c172; color: #fff; flex: 0 0 auto; }
    .li .time { flex: 1 1 auto; font-variant-numeric: tabular-nums; }
    .li .p { font-variant-numeric: tabular-nums; font-weight: 600; color: #16c172; }
    .li.plunge .rank, .li.plunge .p { background: #6f42c1; }
    .li.plunge .p { background: none; color: #8e6bff; }
    .li.current { background: rgba(123,63,242,0.12); }
    .li.current .rank { background: #7b3ff2; }
    .tag { font-size: 9px; font-weight: 700; padding: 1px 6px; border-radius: 8px; vertical-align: middle; }
    .tag.now { background: #7b3ff2; color: #fff; }

    .err { font-size: 13px; color: var(--homey-text-color-light, #888); padding: 10px 0; }
    .freshness { color: #92400e; font-size: 10px; margin-top: 5px; }
    .muted { font-size: 11px; color: var(--homey-text-color-light, #888); padding: 14px 0; text-align: center; }
    .prov-badge { display: inline-block; font-size: 10px; padding: 1px 5px; border-radius: 6px; margin-left: 4px; }
    .prov-row { margin: 4px 0 6px; }
    .prov-msg { color: #92400e; font-size: 10px; margin-left: 4px; }
    .b-current { background: #dcfce7; color: #166534; }
    .b-stale { background: #fef3c7; color: #92400e; }
    .b-unknown { background: #e5e7eb; color: #4b5563; }
    .b-estimated { background: #ede9fe; color: #5b21b6; }
  </style>
</head>
<body>
  <div id="content" aria-live="polite" role="region" aria-label="Octopus Agile prices"><div class="err">Loading…</div></div>

  <script type="text/javascript">
    var STATE = { data: null, tab: 'today' };

    function fmt(v, dp) {
      if (v === null || v === undefined || isNaN(v)) return '–';
      return Number(v).toFixed(dp === undefined ? 2 : dp);
    }

    function esc(value) {
      return String(value).replace(/[&<>"']/g, function (char) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char];
      });
    }

    function slotsFor(d, tab) {
      return tab === 'tomorrow' ? (d.tomorrow || []) : (d.today || []);
    }

    function provenanceBadge(label, cls) { return '<span class="prov-badge ' + cls + '">' + esc(label) + '</span>'; }
    function estimatedBadge(label) { return provenanceBadge(label || 'Estimated', 'b-estimated'); }
    function freshnessHtml(d, sourceLabel, sourceKey) {
      var f = d && d.freshness;
      var src = (f && f.sources && sourceKey) ? f.sources[sourceKey] : null;
      var state = 'Unknown';
      var cls = 'b-unknown';
      var message = 'Freshness is not yet known.';
      var readAt = f ? f.updatedAt : null;
      if (src) {
        readAt = src.updatedAt;
        if (src.state === 'current') { state = 'Current'; cls = 'b-current'; message = ''; }
        else if (src.state === 'stale') { state = 'Stale'; cls = 'b-stale'; message = (f && f.problem) ? 'Connection issue; showing the last available data.' : 'Data may be out of date.'; }
        else { message = 'No data yet.'; }
      } else if (f && f.updatedAt && !f.stale && !f.problem) { state = 'Current'; cls = 'b-current'; message = ''; }
      else if (f && f.updatedAt) { state = 'Stale'; cls = 'b-stale'; message = f.problem ? 'Connection issue; showing the last available data.' : 'Data may be out of date.'; }
      else if (f && f.problem) { message = 'Connection issue; current data is unavailable.'; }
      var age = (typeof ageText === 'function') ? ageText(readAt) : '';
      var label = (sourceLabel || 'Device refresh') + ' \u00b7 ' + state + (age ? ' \u00b7 ' + age : '');
      return '<div class="prov-row" role="status">' + provenanceBadge(label, cls)
        + (message ? '<span class="prov-msg">' + esc(message) + '</span>' : '') + '</div>';
    }
    function ageText(readAt) {
      if (!readAt) return '';
      var t = Date.parse(readAt);
      if (isNaN(t)) return '';
      var s = Math.max(0, Math.round((Date.now() - t) / 1000));
      return s < 90 ? (s + 's ago') : (Math.round(s / 60) + 'm ago');
    }

    function bandLabel(band) {
      return {
        negative: 'Negative', green: 'Green', yellow: 'Yellow', orange: 'Orange', red: 'Red', unknown: 'Unknown'
      }[band] || 'Unknown';
    }

    function bandOptions(d) {
      return (d && d.bandOptions) || {
        mode: 'price_bands', palette: 'standard', corrected: false,
        thresholds: { greenMax: 10, yellowMax: 20, orangeMax: 30 }
      };
    }

    function renderBandLegend(options) {
      if (options.mode !== 'price_bands') return '';
      var t = options.thresholds;
      return '<div class="band-legend" aria-label="Price colour legend">'
        + '<span class="legend-item"><span class="swatch band-negative"></span>Negative &lt;0p</span>'
        + '<span class="legend-item"><span class="swatch band-green"></span>0–' + fmt(t.greenMax) + 'p</span>'
        + '<span class="legend-item"><span class="swatch band-yellow"></span>&gt;' + fmt(t.greenMax) + '–' + fmt(t.yellowMax) + 'p</span>'
        + '<span class="legend-item"><span class="swatch band-orange"></span>&gt;' + fmt(t.yellowMax) + '–' + fmt(t.orangeMax) + 'p</span>'
        + '<span class="legend-item"><span class="swatch band-red"></span>&gt;' + fmt(t.orangeMax) + 'p</span>'
        + '</div>'
        + (options.corrected ? '<div class="band-advisory" role="status">Invalid thresholds; using 10p / 20p / 30p defaults.</div>' : '');
    }

    function renderChart(slots, options) {
      if (!slots.length) return '<div class="muted">No half-hourly prices for this day.</div>';
      var prices = slots.map(function (s) { return s.price; });
      var max = Math.max.apply(null, prices);
      var min = Math.min.apply(null, prices);
      var ceiling = Math.max(0, max);
      var floor = Math.min(0, min);
      var span = (ceiling - floor) || 1;
      var zeroTop = Math.round(((ceiling - 0) / span) * 1000) / 10;

      var bars = slots.map(function (s) {
        var valueTop = Math.round(((ceiling - s.price) / span) * 1000) / 10;
        var top = s.price < 0 ? zeroTop : valueTop;
        var height = Math.max(2, Math.abs(zeroTop - valueTop));
        var cls = 'bar';
        if (options.mode === 'cheapest_slots') {
          cls += ' legacy';
          if (s.price < 0) cls += ' legacy-negative';
          else if (s.cheapest) cls += ' legacy-cheapest';
        } else {
          cls += ' band-' + s.band;
          if (s.cheapest) cls += ' cheapest-marker';
        }
        if (s.current) cls += ' current';
        var description = options.mode === 'price_bands'
          ? bandLabel(s.band) + ' price band' : (s.cheapest ? 'Cheapest highlighted slot' : 'Price slot');
        var title = esc(s.label + ' · ' + fmt(s.price) + 'p · ' + description);
        return '<div class="bar-slot"><div class="' + cls + '" role="img" aria-label="' + title
          + '" style="top:' + top + '%;height:' + height + '%" title="' + title + '"></div></div>';
      }).join('');

      return ''
        + '<div class="chart-wrap">'
        +   '<div class="axis"><span>' + fmt(ceiling, ceiling >= 100 ? 0 : 1) + 'p</span>'
        +     '<span>' + fmt(min, min >= 100 ? 0 : 1) + 'p</span></div>'
        +   '<div class="chart-col">'
        +     '<div class="chart"><div class="zero-line" style="top:' + zeroTop + '%"></div>' + bars + '</div>'
        +     '<div class="ticks"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span></div>'
        +     renderBandLegend(options)
        +   '</div>'
        + '</div>';
    }

    function addHalfHour(label) {
      var p = String(label).split(':');
      var h = Number(p[0]) || 0;
      var m = (Number(p[1]) || 0) + 30;
      if (m >= 60) { m -= 60; h = (h + 1) % 24; }
      return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
    }

    function renderBestList(slots) {
      var best = slots.filter(function (s) { return s.cheapest; });
      if (!best.length) {
        return '<div class="muted">Set “Highlight cheapest slots” above 0 to see best times.</div>';
      }
      best.sort(function (a, b) { return a.price - b.price; });
      var rows = best.map(function (s, i) {
        var cls = 'li';
        if (s.price < 0) cls += ' plunge';
        if (s.current) cls += ' current';
        var range = esc(s.label + ' – ' + addHalfHour(s.label));
        var now = s.current ? ' <span class="tag now">Now</span>' : '';
        return '<div class="' + cls + '">'
          + '<span class="rank">' + (i + 1) + '</span>'
          + '<span class="time">' + range + now + '</span>'
          + '<span class="p">' + fmt(s.price) + 'p</span></div>';
      }).join('');
      return '<div class="lhead"><span><span class="hl">✅ Best times to use power</span> · cheapest first</span>' + estimatedBadge('Estimated selection')
        + '<span>Price/kWh</span></div>'
        + '<div class="list" id="list">' + rows + '</div>';
    }

    function render() {
      var d = STATE.data;
      var el = document.getElementById('content');
      if (!d || d.error) {
        el.innerHTML = '<div class="err">' + esc((d && d.error) || 'No data') + '</div>';
        return;
      }
      var tomorrowOk = !!(d.tomorrowAvailable && (d.tomorrow || []).length);
      if (STATE.tab === 'tomorrow' && !tomorrowOk) STATE.tab = 'today';
      var slots = slotsFor(d, STATE.tab);
      var options = bandOptions(d);
      var palettes = ['standard', 'colourblind', 'high_contrast'];
      var palette = palettes.indexOf(options.palette) >= 0 ? options.palette : 'standard';
      document.body.className = 'palette-' + palette.replace('_', '-');

      var level = ['plunge', 'cheap', 'normal', 'expensive'].indexOf(d.currentLevel) >= 0
        ? d.currentLevel : 'normal';
      var html = '';
      html += '<div class="head">';
      html += '<span class="name">' + esc(d.name || 'Electricity') + '</span>';
      var currentSlot = (d.today || []).filter(function (slot) { return slot.current; })[0];
      var currentBadge = options.mode === 'price_bands' && currentSlot
        ? '<span class="price-band-badge band-' + currentSlot.band + '">' + bandLabel(currentSlot.band) + '</span>'
        : '<span class="badge ' + level + '">' + level + '</span>';
      html += '<span class="now"><span class="val">' + fmt(d.currentPrice)
        + ' <small>p/kWh</small></span><br>' + currentBadge + '</span>';
      html += '</div>';
      html += freshnessHtml(d, 'Price', 'prices');

      html += '<div class="tabs">';
      html += '<button type="button" class="tab' + (STATE.tab === 'today' ? ' active' : '')
        + '" data-tab="today" aria-pressed="' + (STATE.tab === 'today') + '">Today</button>';
      html += '<button type="button" class="tab' + (STATE.tab === 'tomorrow' ? ' active' : '')
        + (tomorrowOk ? '' : ' disabled') + '" data-tab="tomorrow" aria-pressed="'
        + (STATE.tab === 'tomorrow') + '"' + (tomorrowOk ? '' : ' disabled') + '>Tomorrow</button>';
      html += '</div>';

      if (STATE.tab === 'tomorrow' && !tomorrowOk) {
        html += '<div class="muted">Tomorrow\u2019s prices are not published yet (usually after ~4pm).</div>';
      } else {
        html += renderChart(slots, options);
        html += renderBestList(slots);
      }

      el.innerHTML = html;
    }

    function onHomeyReady(Homey) {
      // Delegate clicks on the static #content node (survives re-renders).
      var content = document.getElementById('content');
      content.addEventListener('click', function (e) {
        var node = e.target;
        while (node && node !== content && !(node.className && String(node.className).indexOf('tab') !== -1 && node.getAttribute && node.getAttribute('data-tab'))) {
          node = node.parentNode;
        }
        if (!node || node === content || !node.getAttribute) return;
        var t = node.getAttribute('data-tab');
        if (!t) return;
        if (String(node.className).indexOf('disabled') !== -1) return;
        if (STATE.tab === t) return;
        STATE.tab = t;
        render();
      });

      function readSettings() {
        var deviceId = '';
        var cheapest = '';
        var colourMode = '';
        var greenMax = '';
        var yellowMax = '';
        var orangeMax = '';
        var palette = '';
        try {
          var settings = Homey.getSettings();
          if (settings) {
            if (settings.device) deviceId = (typeof settings.device === 'object') ? (settings.device.id || '') : settings.device;
            if (settings.cheapest_count !== undefined && settings.cheapest_count !== null) cheapest = settings.cheapest_count;
            if (settings.colour_mode) colourMode = settings.colour_mode;
            if (settings.green_max !== undefined && settings.green_max !== null) greenMax = settings.green_max;
            if (settings.yellow_max !== undefined && settings.yellow_max !== null) yellowMax = settings.yellow_max;
            if (settings.orange_max !== undefined && settings.orange_max !== null) orangeMax = settings.orange_max;
            if (settings.palette) palette = settings.palette;
          }
        } catch (e) { /* no settings */ }
        return {
          deviceId: deviceId, cheapest: cheapest, colourMode: colourMode,
          greenMax: greenMax, yellowMax: yellowMax, orangeMax: orangeMax, palette: palette
        };
      }

      var loading = false;
      async function load() {
        if (loading) return;
        loading = true;
        // Re-read settings each poll so changing "cheapest slots" updates live.
        var s = readSettings();
        try {
          var q = '/?id=' + encodeURIComponent(s.deviceId)
            + '&cheapest=' + encodeURIComponent(s.cheapest)
            + '&colour_mode=' + encodeURIComponent(s.colourMode)
            + '&green_max=' + encodeURIComponent(s.greenMax)
            + '&yellow_max=' + encodeURIComponent(s.yellowMax)
            + '&orange_max=' + encodeURIComponent(s.orangeMax)
            + '&palette=' + encodeURIComponent(s.palette);
          STATE.data = await Homey.api('GET', q);
          render();
          Homey.setHeight(document.body.scrollHeight);
        } catch (err) {
          STATE.data = { error: (err && err.message) ? err.message : 'Error' };
          render();
        } finally {
          loading = false;
        }
      }

      load();
      setInterval(load, 60000);
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) load();
      });
      window.addEventListener('focus', load);
      Homey.ready();
    }
  </script>
</body>
</html>
