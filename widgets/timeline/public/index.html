<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script type="text/javascript" src="/homey.js" data-origin="widget"></script>
  <style>
    html, body { margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--homey-text-color, #222); padding: 10px 12px; }
    .name { font-size: 12px; color: var(--homey-text-color-light, #888); margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bars { position: relative; display: flex; align-items: stretch; gap: 2px; height: 90px; }
    .zero-line { position: absolute; left: 0; right: 0; height: 1px; background: rgba(127,127,127,0.42); pointer-events: none; }
    .bar-slot { flex: 1; min-width: 0; position: relative; }
    .bar { position: absolute; left: 0; right: 0; background: #888; border-radius: 2px 2px 0 0; min-height: 2px; }
    .bar.band-negative, .swatch.band-negative { background: #2563eb; }
    .bar.band-green, .swatch.band-green { background: #16a34a; }
    .bar.band-yellow, .swatch.band-yellow { background: #ca8a04; }
    .bar.band-orange, .swatch.band-orange { background: #ea580c; }
    .bar.band-red, .swatch.band-red { background: #dc2626; }
    body.palette-colourblind .bar.band-negative, body.palette-colourblind .swatch.band-negative { background: #0072b2; }
    body.palette-colourblind .bar.band-green, body.palette-colourblind .swatch.band-green { background: #009e73; }
    body.palette-colourblind .bar.band-yellow, body.palette-colourblind .swatch.band-yellow { background: #e6a700; }
    body.palette-colourblind .bar.band-orange, body.palette-colourblind .swatch.band-orange { background: #d55e00; }
    body.palette-colourblind .bar.band-red, body.palette-colourblind .swatch.band-red { background: #cc4f87; }
    body.palette-high-contrast .bar.band-negative, body.palette-high-contrast .swatch.band-negative { background: #0047ab; }
    body.palette-high-contrast .bar.band-green, body.palette-high-contrast .swatch.band-green { background: #007a3d; }
    body.palette-high-contrast .bar.band-yellow, body.palette-high-contrast .swatch.band-yellow { background: #8a6d00; }
    body.palette-high-contrast .bar.band-orange, body.palette-high-contrast .swatch.band-orange { background: #c2410c; }
    body.palette-high-contrast .bar.band-red, body.palette-high-contrast .swatch.band-red { background: #991b1b; }
    .axis { display: flex; justify-content: space-between; font-size: 10px; color: var(--homey-text-color-light, #888); margin-top: 4px; }
    .err { font-size: 13px; color: var(--homey-text-color-light, #888); }
    .freshness { color: #92400e; font-size: 10px; margin-bottom: 5px; }
    .prov-badge { display: inline-block; font-size: 10px; padding: 1px 5px; border-radius: 6px; margin-left: 4px; }
    .prov-row { margin: 4px 0 6px; }
    .prov-msg { color: #92400e; font-size: 10px; margin-left: 4px; }
    .b-current { background: #dcfce7; color: #166534; }
    .b-stale { background: #fef3c7; color: #92400e; }
    .b-unknown { background: #e5e7eb; color: #4b5563; }
    .b-estimated { background: #ede9fe; color: #5b21b6; }
    .band-legend { display: flex; flex-wrap: wrap; gap: 3px 7px; margin-top: 4px; font-size: 9px; color: var(--homey-text-color-light, #666); }
    .legend-item { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
    .swatch { display: inline-block; width: 8px; height: 8px; border-radius: 2px; border: 1px solid rgba(0,0,0,0.18); }
    .band-advisory { margin-top: 3px; color: #92400e; font-size: 10px; }
  </style>
</head>
<body>
  <div id="content" aria-live="polite" role="region" aria-label="Octopus price timeline"><div class="err">Loading…</div></div>

  <script type="text/javascript">
    function esc(value) {
      return String(value).replace(/[&<>"']/g, function (char) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char];
      });
    }
    function provenanceBadge(label, cls) { return '<span class="prov-badge ' + cls + '">' + esc(label) + '</span>'; }
    function estimatedBadge(label) { return provenanceBadge(label || 'Estimated', 'b-estimated'); }
    function freshnessHtml(d, sourceLabel, sourceKey) {
      var f = d && d.freshness;
      var src = (f && f.sources && sourceKey) ? f.sources[sourceKey] : null;
      var state = 'Unknown';
      var cls = 'b-unknown';
      var message = 'Freshness is not yet known.';
      var readAt = f ? f.updatedAt : null;
      if (src) {
        readAt = src.updatedAt;
        if (src.state === 'current') { state = 'Current'; cls = 'b-current'; message = ''; }
        else if (src.state === 'stale') { state = 'Stale'; cls = 'b-stale'; message = (f && f.problem) ? 'Connection issue; showing the last available data.' : 'Data may be out of date.'; }
        else { message = 'No data yet.'; }
      } else if (f && f.updatedAt && !f.stale && !f.problem) { state = 'Current'; cls = 'b-current'; message = ''; }
      else if (f && f.updatedAt) { state = 'Stale'; cls = 'b-stale'; message = f.problem ? 'Connection issue; showing the last available data.' : 'Data may be out of date.'; }
      else if (f && f.problem) { message = 'Connection issue; current data is unavailable.'; }
      var age = (typeof ageText === 'function') ? ageText(readAt) : '';
      var label = (sourceLabel || 'Device refresh') + ' \u00b7 ' + state + (age ? ' \u00b7 ' + age : '');
      return '<div class="prov-row" role="status">' + provenanceBadge(label, cls)
        + (message ? '<span class="prov-msg">' + esc(message) + '</span>' : '') + '</div>';
    }
    function ageText(readAt) {
      if (!readAt) return '';
      var t = Date.parse(readAt);
      if (isNaN(t)) return '';
      var s = Math.max(0, Math.round((Date.now() - t) / 1000));
      return s < 90 ? (s + 's ago') : (Math.round(s / 60) + 'm ago');
    }
    function fmt(v) {
      if (v === null || v === undefined || isNaN(v)) return '–';
      return Number(v).toFixed(2);
    }
    function bandLabel(band) {
      return {
        negative: 'Negative', green: 'Green', yellow: 'Yellow', orange: 'Orange', red: 'Red', unknown: 'Unknown'
      }[band] || 'Unknown';
    }
    function bandOptions(d) {
      return (d && d.bandOptions) || {
        palette: 'standard', corrected: false,
        thresholds: { greenMax: 10, yellowMax: 20, orangeMax: 30 }
      };
    }
    function renderBandLegend(options) {
      const t = options.thresholds;
      return '<div class="band-legend" aria-label="Price colour legend">'
        + '<span class="legend-item"><span class="swatch band-negative"></span>Negative &lt;0p</span>'
        + '<span class="legend-item"><span class="swatch band-green"></span>0–' + fmt(t.greenMax) + 'p</span>'
        + '<span class="legend-item"><span class="swatch band-yellow"></span>&gt;' + fmt(t.greenMax) + '–' + fmt(t.yellowMax) + 'p</span>'
        + '<span class="legend-item"><span class="swatch band-orange"></span>&gt;' + fmt(t.yellowMax) + '–' + fmt(t.orangeMax) + 'p</span>'
        + '<span class="legend-item"><span class="swatch band-red"></span>&gt;' + fmt(t.orangeMax) + 'p</span>'
        + '</div>'
        + (options.corrected ? '<div class="band-advisory" role="status">Invalid thresholds; using 10p / 20p / 30p defaults.</div>' : '');
    }
    function render(d) {
      const el = document.getElementById('content');
      if (!d || d.error || !d.prices || !d.prices.length) {
        el.innerHTML = '<div class="err">' + esc((d && d.error) || 'No price data yet') + '</div>';
        return;
      }
      const prices = d.prices.slice(0, 24);
      const options = bandOptions(d);
      const palettes = ['standard', 'colourblind', 'high_contrast'];
      const palette = palettes.indexOf(options.palette) >= 0 ? options.palette : 'standard';
      document.body.className = 'palette-' + palette.replace('_', '-');
      const vals = prices.map((p) => p.price);
      const max = Math.max(...vals, 0);
      const min = Math.min(...vals, 0);
      const range = (max - min) || 1;
      const zeroTop = Math.round(((max - 0) / range) * 1000) / 10;
      let bars = '';
      prices.forEach((p) => {
        const valueTop = Math.round(((max - p.price) / range) * 1000) / 10;
        const top = p.price < 0 ? zeroTop : valueTop;
        const height = Math.max(2, Math.abs(zeroTop - valueTop));
        const band = p.band || 'unknown';
        const title = esc(hh(p.start) + ' · ' + fmt(p.price) + 'p/kWh · ' + bandLabel(band) + ' price band');
        bars += '<div class="bar-slot"><div class="bar band-' + band + '" role="img" aria-label="'
          + title + '" style="top:' + top + '%;height:' + height + '%" title="' + title + '"></div></div>';
      });
      function hh(iso) { const dt = new Date(iso); return ('0' + dt.getHours()).slice(-2) + ':' + ('0' + dt.getMinutes()).slice(-2); }
      el.innerHTML = '<div class="name">' + esc(d.name || 'Electricity') + ' — next ' + (prices.length / 2) + 'h</div>'
        + freshnessHtml(d, 'Device refresh')
        + '<div class="bars"><div class="zero-line" style="top:' + zeroTop + '%"></div>' + bars + '</div>'
        + '<div class="axis"><span>' + hh(prices[0].start) + '</span><span>' + hh(prices[prices.length - 1].start) + '</span></div>'
        + renderBandLegend(options);
    }

    function onHomeyReady(Homey) {
      function readSettings() {
        let deviceId = '';
        let greenMax = '';
        let yellowMax = '';
        let orangeMax = '';
        let palette = '';
        try {
          const s = Homey.getSettings();
          if (s) {
            if (s.device) deviceId = (typeof s.device === 'object') ? (s.device.id || '') : s.device;
            if (s.green_max !== undefined && s.green_max !== null) greenMax = s.green_max;
            if (s.yellow_max !== undefined && s.yellow_max !== null) yellowMax = s.yellow_max;
            if (s.orange_max !== undefined && s.orange_max !== null) orangeMax = s.orange_max;
            if (s.palette) palette = s.palette;
          }
        } catch (e) { /* no settings */ }
        return {
          deviceId, greenMax, yellowMax, orangeMax, palette,
        };
      }
      async function load() {
        try {
          const settings = readSettings();
          const query = '/?id=' + encodeURIComponent(settings.deviceId)
            + '&green_max=' + encodeURIComponent(settings.greenMax)
            + '&yellow_max=' + encodeURIComponent(settings.yellowMax)
            + '&orange_max=' + encodeURIComponent(settings.orangeMax)
            + '&palette=' + encodeURIComponent(settings.palette);
          const data = await Homey.api('GET', query);
          render(data);
          Homey.setHeight(document.body.scrollHeight);
        } catch (err) { render({ error: (err && err.message) || 'Error' }); }
      }
      load();
      setInterval(load, 60000);
      Homey.ready();
    }
  </script>
</body>
</html>
