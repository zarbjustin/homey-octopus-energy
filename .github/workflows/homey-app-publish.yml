name: Publish Homey App

# Requires a repository secret named HOMEY_PAT (a Homey Personal Access Token).
# 1. Create the token: https://tools.developer.homey.app -> account menu (top-right)
#    -> Personal Access Tokens -> Create new token -> copy it.
# 2. Store it as a secret (run in a terminal with the GitHub CLI authenticated):
#       gh secret set HOMEY_PAT -R zarbjustin/homey-octopus-energy
#    or via GitHub: repo -> Settings -> Secrets and variables -> Actions ->
#    New repository secret -> name "HOMEY_PAT".
# 3. Run this workflow from the Actions tab (Run workflow) to publish a build.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  main:
    name: Publish Homey App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --omit=dev

      - name: Lint
        run: npm run lint

      - name: Build and test
        run: npm test

      - name: Validate Homey App
        run: npm exec --yes --package=homey@4.3.1 -- homey app validate --level publish

      # Same headless CLI command as Athom's Docker action. The existing secret
      # stays in this step's environment; never print or persist it.
      - name: Publish Homey App
        id: publish
        run: |
          npm ci --ignore-scripts
          npm exec --yes --package=homey@4.3.1 -- homey app publish
          node -e 'console.log("url=https://tools.developer.homey.app/apps/app/" + require("./app.json").id)' >> "$GITHUB_OUTPUT"
        env:
          HOMEY_HEADLESS: '1'
          HOMEY_PAT: ${{ secrets.HOMEY_PAT }}

      - name: URL
        run: |
          echo "Manage your app at ${{ steps.publish.outputs.url }}." >> $GITHUB_STEP_SUMMARY
