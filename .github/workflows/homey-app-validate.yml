name: Validate Homey App
on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  main:
    name: Validate Homey App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      # The official Docker action wraps this same CLI command. Run it directly
      # on Node 22 to avoid Docker Hub pull limits; keep the CLI version explicit.
      - name: Validate Homey App
        run: npm exec --yes --package=homey@4.3.1 -- homey app validate --level publish
